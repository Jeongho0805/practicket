spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  # 테스트는 H2 + create-drop 으로 스키마를 만든다.
  # 마이그레이션 SQL 은 MySQL 문법이라 H2 에서 돌리면 깨진다.
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 1s


app:
  host: "http://localhost:8080"