<div id="adsence-section" th:fragment="adsence-section" th:with="banner=${@adSlotView.render('PC_RIGHT')}">
    <!-- 직접 판매된 배너가 있으면 그것, 없으면 애드센스 fallback(prod만) -->
    <a th:if="${banner != null}" th:href="@{/ad/click/{id}(id=${banner.id})}" target="_blank" rel="noopener"
       style="display:block; width:100%; height:100%;">
        <img th:src="${banner.imagePath}" th:alt="${banner.advertiserName}"
             style="width:100%; height:100%; object-fit:contain;"/>
    </a>
    <th:block th:if="${banner == null and activeProfile == 'prod'}">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5146591484722882"
                crossorigin="anonymous"></script>
        <ins class="adsbygoogle"
             style="display:block; width: 100%; height: 100%; max-height: 100%"
             data-ad-client="ca-pub-5146591484722882"
             data-ad-slot="9697904962"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </th:block>
</div>
