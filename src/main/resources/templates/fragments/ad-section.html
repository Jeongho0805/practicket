<div id="ad-section" th:fragment="ad-section"
     th:with="mobileSlot=${@adSlotView.peek('MOBILE_TOP')},
              pcSlot=${@adSlotView.peek('PC_LEFT')},
              mobileBanner=${mobileSlot != null ? mobileSlot : pcSlot},
              pcBanner=${pcSlot != null ? pcSlot : mobileSlot}">
    <!--
      배너 선택은 화면 폭 기준(CSS)이다. UA로 기기를 추측하면 데스크톱 창을 좁혔을 때 어긋난다.
      노출 집계는 실제로 보이는 쪽만 /js/ad-metrics.js 가 보고한다(서버 렌더 시점 집계 없음).
      한쪽 슬롯만 비어 있으면 있는 배너를 양쪽에 쓰고, 둘 다 비면 쿠팡 fallback.
    -->
    <a th:if="${mobileBanner != null}" class="ad-slot-link desktop-invisible"
       th:href="@{/ad/click/{id}(id=${mobileBanner.id})}" target="_blank" rel="noopener"
       th:attr="aria-label=${mobileBanner.advertiserName} + ' 광고'">
        <img th:src="${mobileBanner.imagePath}" th:alt="${mobileBanner.advertiserName}"
             th:attr="data-banner-id=${mobileBanner.id}"/>
    </a>

    <a th:if="${pcBanner != null}" class="ad-slot-link mobile-invisible"
       th:href="@{/ad/click/{id}(id=${pcBanner.id})}" target="_blank" rel="noopener"
       th:attr="aria-label=${pcBanner.advertiserName} + ' 광고'">
        <img th:src="${pcBanner.imagePath}" th:alt="${pcBanner.advertiserName}"
             th:attr="data-banner-id=${pcBanner.id}"/>
    </a>

    <div th:if="${mobileBanner == null and pcBanner == null}" id="coupang-ad-wrapper" style="height: 100%">
        <script src="https://ads-partners.coupang.com/g.js"></script>
        <script>
            new PartnersCoupang.G({"id":943782,"template":"carousel","trackingCode":"AF2647827","height":"100%", "width": "100%", "tsource":""});
        </script>
    </div>
</div>
