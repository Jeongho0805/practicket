<div id="ad-section" th:fragment="ad-section" th:with="banner=${@adSlotView.render('PC_LEFT')}">
    <!-- 직접 판매된 배너가 있으면 그것, 없으면 쿠팡 fallback -->
    <a th:if="${banner != null}" th:href="@{/ad/click/{id}(id=${banner.id})}" target="_blank" rel="noopener"
       style="display:block; width:100%; height:100%;">
        <img th:src="${banner.imagePath}" th:alt="${banner.advertiserName}"
             style="width:100%; height:100%; object-fit:contain;"/>
    </a>
    <div th:if="${banner == null}" id="coupang-ad-wrapper" style="height: 100%">
        <script src="https://ads-partners.coupang.com/g.js"></script>
        <script>
            new PartnersCoupang.G({"id":943782,"template":"carousel","trackingCode":"AF2647827","height":"100%", "width": "100%", "tsource":""});
        </script>
    </div>
</div>
