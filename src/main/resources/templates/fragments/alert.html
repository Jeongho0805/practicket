<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alert" id="pkt-alert-overlay">
    <div id="pkt-alert-box">
        <div id="pkt-alert-title"></div>
        <div id="pkt-alert-msg"></div>
        <div id="pkt-alert-footer">
            <button id="pkt-alert-cancel" class="pkt-alert-btn" hidden>취소</button>
            <button id="pkt-alert-confirm" class="pkt-alert-btn">확인</button>
        </div>
    </div>
</div>
</body>
</html>
