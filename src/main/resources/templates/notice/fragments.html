<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  공지 목록 한 줄의 마크업. 첫 화면(notice/list)과 무한스크롤 추가분(/notice/more)이 같이 쓴다.
  두 곳에서 같은 HTML 을 따로 관리하지 않으려고 조각으로 뺐다.

  data-month 는 클라이언트가 "지금까지 그린 마지막 달"을 알아내려고 읽는다.
  다음 요청에 lastMonth 로 실어 보내면 서버가 월 헤더 중복을 막아준다.
-->
<body>

<th:block th:fragment="items">
    <th:block th:each="row : ${rows}">
        <div class="nt-month" th:if="${row.monthHeader != null}">
            <b th:text="${row.monthHeader}">2026년 6월</b><i></i>
        </div>

        <div class="nt-item" th:classappend="${row.notice.type.name() == 'NOTICE'} ? 'is-notice'"
             th:attr="data-month=${row.monthKey}">
            <a class="nt-a" th:href="@{/notice/{id}(id=${row.notice.id})}">
                <span class="nt-line">
                    <span class="nt-pin" th:if="${row.notice.pinned}">고정</span>
                    <span class="tag" th:classappend="${row.notice.type.badgeClass}"
                          th:text="${row.notice.type.label}">공지</span>
                    <span class="nt-title" th:text="${row.notice.title}">제목</span>
                    <span class="nt-date"
                          th:text="${#temporals.format(row.notice.createdAt, 'yyyy.MM.dd')}">2026.06.30</span>
                </span>
                <span class="nt-desc" th:text="${row.notice.content}">본문 요약</span>
            </a>
        </div>
    </th:block>
</th:block>

</body>
</html>
