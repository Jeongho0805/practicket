<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="/image/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/image/favicon-180.png">
    <!-- 공유(OG) 기본값 - 카카오/외부 채널.
         크롤러는 같은 property 가 여러 번 나오면 먼저 나온 것을 쓴다. 페이지가 자기 값을
         내보낼 때는 customOg 를 넘겨 이 기본값을 통째로 끈다(예: 연습 결과 공유 페이지). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="프랙티켓">
    <th:block th:if="${customOg == null}">
        <meta property="og:title" content="프랙티켓 - 티켓팅 연습 플랫폼">
        <meta property="og:description" content="실전과 똑같은 티켓팅 예매 연습 플랫폼. 진짜 예매 전에 미리 손에 익히세요.">
        <meta property="og:image" th:attr="content=|${host}/image/og-card.png|">
        <meta property="og:url" th:attr="content=|${host}/|">
    </th:block>
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/css/layout/default.css">
    <link rel="stylesheet" href="/css/fragments/header.css">
    <link rel="stylesheet" href="/css/common/alert.css">
    <link rel="stylesheet" href="/css/fragments/chatting.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y1YB3RZ41Z"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Y1YB3RZ41Z');
    </script>
</head>
<body>
    <div th:replace="~{fragments/header::header}"></div>
    <div id="content-section">
        <div th:replace="~{fragments/ad-section::ad-section}"></div>
        <div layout:fragment="content"></div>
        <div th:replace="~{fragments/adsence-section::adsence-section}"></div>
    </div>

    <th:block th:replace="~{fragments/alert :: alert}"></th:block>

    <!-- 전역 플로팅 채팅 위젯 (모든 페이지 공통, 열 때 SSE 연결) -->
    <div id="chat-widget">
        <div id="chat-panel">
            <div id="chat-panel-head">
                <b>실시간 채팅</b>
                <div class="chat-head-right">
                    <span class="chat-count"><span class="chat-count-dot"></span><span><span id="chat-count-num">0</span>명 접속중</span></span>
                    <button type="button" id="chat-close" aria-label="채팅 닫기">&times;</button>
                </div>
            </div>
            <div th:replace="~{fragments/chatting::chatting}"></div>
        </div>
        <button type="button" id="chat-launcher" aria-label="채팅 열기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.45-5.35A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.2 11.5h.01M12 11.5h.01M15.8 11.5h.01"/></svg>
            <span class="chat-dot"></span>
        </button>
        <button type="button" id="chat-hide" aria-label="채팅 버튼 숨기기">
            <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>
        </button>
        <button type="button" id="chat-restore" aria-label="채팅 버튼 다시 보기" title="채팅 다시 보기" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.45-5.35A8.5 8.5 0 1 1 21 11.5z"/></svg>
        </button>
        <div id="chat-toast" role="status" hidden>
            <span>채팅 버튼을 숨겼어요</span>
            <button type="button" id="chat-toast-undo">되돌리기</button>
        </div>
    </div>

    <!-- 같은 서버의 API를 호출하므로 접속한 origin을 그대로 쓴다.
         localhost로 연 맥과 사설 IP로 연 모바일이 별도 설정 없이 모두 동작한다. -->
    <script> const HOST = window.location.origin; </script>
    <script type="module" src="/js/common.js"></script>
    <script type="module" src="/js/header.js"></script>
    <script type="module" src="/js/chatting.js"></script>
    <script type="module" src="/js/ad-metrics.js"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
