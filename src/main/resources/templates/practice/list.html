<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <meta name="description" content="실제 예매처와 똑같은 흐름으로 티켓팅을 연습하는 실전 연습 화면입니다.">
    <meta name="robots" content="index, follow">
    <title>실전 연습 - 프랙티켓</title>
    <link rel="canonical" href="https://practicket.com/practice">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/practice/list.css" />
</head>

<body layout:fragment="content">
    <div class="practice-hub-container">

        <!-- 1. 연습 선택 영역 -->
        <section>
            <div class="practice-grid">
                <a href="/practice/i-ticket/intro" class="practice-card active" onclick="goToITicket(event)">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-available">이용 가능</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">I-Ticket</span>
                        </div>
                    </div>
                </a>
                <a href="/practice/i-ticket-new/intro" class="practice-card active" onclick="goToITicketNew(event)">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-available">이용 가능</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">I-Ticket</span>
                            <span class="badge-new-ui">New UI</span>
                        </div>
                    </div>
                </a>
                <div class="practice-card disabled">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-coming">준비중</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">M-Ticket</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 랭킹 보드 -->
        <section style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <div class="ranking-board">

                <!-- 뷰 모드 탭 -->
                <div class="ranking-top-bar">
                    <button class="view-mode-tab active" onclick="switchMainTab('ranking', this)">전체 랭킹</button>
                    <button class="view-mode-tab" onclick="switchMainTab('myrecord', this)">내 기록</button>
                </div>

                <!-- ── 전체 랭킹 패널 ── -->
                <div id="panel-ranking" class="panel active">
                    <div class="filter-bar">
                        <div class="agency-tabs">
                            <button class="agency-tab active" onclick="selectAgency(this, 'I_TICKET_OLD')">I-Ticket</button>
                            <button class="agency-tab" onclick="selectAgency(this, 'I_TICKET_NEW')">I-Ticket(New)</button>
                            <button class="agency-tab disabled" disabled>M-Ticket</button>
                        </div>
                        <div class="period-tabs">
                            <button class="period-tab active" onclick="selectPeriod(this)">일간</button>
                            <button class="period-tab" onclick="selectPeriod(this)">주간</button>
                            <button class="period-tab" onclick="selectPeriod(this)">월간</button>
                        </div>
                    </div>

                    <div class="ranking-table-header">
                        <table class="ranking-table">
                            <colgroup>
                                <col style="width: 15%;">
                                <col style="width: 55%;">
                                <col style="width: 30%;">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>순위</th>
                                    <th style="text-align: left; padding-left: 30px;">닉네임</th>
                                    <th>최고 기록</th>
                                </tr>
                            </thead>
                        </table>
                    </div>

                    <div class="ranking-table-body">
                        <table class="ranking-table">
                            <colgroup>
                                <col style="width: 15%;">
                                <col style="width: 55%;">
                                <col style="width: 30%;">
                            </colgroup>
                            <tbody id="rankingTableBody">
                                <tr>
                                    <td colspan="3"
                                        style="text-align:center; padding: 40px; color: #94a3b8; font-size: 14px;">
                                        불러오는 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div id="loadMoreWrap" style="display: none;">
                            <button id="loadMoreBtn" onclick="loadRanking(false)">더 보기</button>
                        </div>
                    </div>
                </div>

                <!-- ── 내 기록 패널 ── -->
                <div id="panel-myrecord" class="panel">

                    <div class="filter-bar">
                        <div class="agency-tabs">
                            <button class="agency-tab active" onclick="selectAgency(this, 'I_TICKET_OLD')">I-Ticket</button>
                            <button class="agency-tab" onclick="selectAgency(this, 'I_TICKET_NEW')">I-Ticket(New)</button>
                            <button class="agency-tab disabled" disabled>M-Ticket</button>
                        </div>
                    </div>

                    <div class="my-stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">이번 달 순위</div>
                            <div id="myRankValue" class="stat-value highlight">-</div>
                            <div id="myRankSub" class="stat-sub">월간 기준</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">최고 기록</div>
                            <div id="myBestRecord" class="stat-value highlight">-</div>
                            <div class="stat-sub">전체 기록 중 최고</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">총 시도</div>
                            <div id="myTotalCount" class="stat-value">-</div>
                            <div class="stat-sub">I-Ticket</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">개선도</div>
                            <div class="improve-wrap" style="padding-top: 4px;">
                                <span id="myImproveSec" class="improve-sec">-</span>
                                <span id="myImprovePct" class="improve-pct" style="display:none;">-</span>
                            </div>
                            <div class="stat-sub">첫 기록 대비</div>
                        </div>
                    </div>

                    <div class="my-record-table-header">
                        <table class="record-table">
                            <colgroup>
                                <col style="width: 13%;">
                                <col style="width: 47%;">
                                <col style="width: 40%;">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>시도</th>
                                    <th style="text-align: left; padding-left: 20px;">날짜 / 시간</th>
                                    <th>기록</th>
                                </tr>
                            </thead>
                        </table>
                    </div>

                    <div class="my-record-table-body">
                        <table class="record-table">
                            <colgroup>
                                <col style="width: 13%;">
                                <col style="width: 47%;">
                                <col style="width: 40%;">
                            </colgroup>
                            <tbody id="myRecordTableBody">
                                <tr>
                                    <td colspan="3"
                                        style="text-align:center; padding: 40px; color: #94a3b8; font-size: 14px;">
                                        기록을 불러오는 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div id="myRecordLoadMoreWrap" style="display: none;">
                            <button id="myRecordLoadMoreBtn" onclick="loadMyRecords(false)">더 보기</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <script type="module" src="/js/practice/list.js"></script>
</body>

</html>
