<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <meta name="description" content="실제 예매처와 똑같은 흐름으로 티켓팅을 연습하는 실전 연습 화면입니다.">
    <meta name="robots" content="index, follow">
    <title>실전연습 - 프랙티켓</title>
    <link rel="canonical" href="https://practicket.com/practice">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/practice/list.css" />
</head>

<body layout:fragment="content">
    <div class="practice-hub-container">

        <div class="hub-tabs" role="tablist">
            <button type="button" class="hub-tab active" data-view="practice">연습하기</button>
            <button type="button" class="hub-tab" data-view="ranking">랭킹</button>
            <button type="button" class="hub-tab" data-view="myrecord">내 기록</button>
        </div>

        <!-- ── 연습하기 ── -->
        <div id="view-practice" class="hub-view active">

            <div class="practice-grid">
                <a href="/practice/i-ticket/intro" class="practice-card active card-i" onclick="goToITicket(event)">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-available">이용 가능</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">I-Ticket</span>
                        </div>
                    </div>
                </a>
                <a href="/practice/n-ticket/intro" class="practice-card active card-n" onclick="goToNTicket(event)">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-available">이용 가능</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">N-Ticket</span>
                        </div>
                    </div>
                </a>
                <a href="/practice/m-ticket/intro" class="practice-card active card-m" onclick="goToMTicket(event)">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-available">이용 가능</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">M-Ticket</span>
                        </div>
                    </div>
                </a>
                <div class="practice-card disabled card-y">
                    <div class="card-stub"></div>
                    <div class="card-sep"></div>
                    <div class="card-main">
                        <div class="card-row-top">
                            <span class="card-label">Practicket</span>
                            <span class="badge-coming">준비중</span>
                        </div>
                        <div class="card-title-row">
                            <span class="card-title">Y-Ticket</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 목록 탭에서만 사용하는 단일 슬롯의 숨겨진 보관 위치. -->
            <div id="practiceMidHome" class="practice-mid-home" hidden>
                <div id="practiceMidHost">
                    <span class="practice-mid-ad" aria-hidden="true"><i>AD</i></span>
                    <div th:replace="~{fragments/ad-slot::slot('PRACTICE_MID')}"></div>
                </div>
            </div>

            <div class="chart-card">
                <div class="ch-head">
                    <div class="ch-title">내 등급</div>
                    <div class="ch-chips">
                        <button type="button" class="ch-chip on" data-agency="I_TICKET_OLD">I-Ticket</button>
                        <button type="button" class="ch-chip" data-agency="N_TICKET">N-Ticket</button>
                        <button type="button" class="ch-chip" data-agency="M_TICKET">M-Ticket</button>
                    </div>
                </div>
                <div id="chartHero" class="ch-hero"></div>
                <div id="chartPlot" class="ch-plot"></div>
            </div>

        </div>

        <!-- ── 랭킹 · 내 기록 ── -->
        <div id="view-rank" class="hub-view">
            <section class="ranking-section">
                <div class="ranking-board">

                    <div class="ranking-top-bar">
                        <div class="period-tabs">
                            <button class="period-tab active" onclick="selectPeriod(this)">일간</button>
                            <button class="period-tab" onclick="selectPeriod(this)">주간</button>
                            <button class="period-tab" onclick="selectPeriod(this)">월간</button>
                            <button class="period-tab" onclick="selectPeriod(this)">전체</button>
                        </div>
                    </div>

                    <!-- ── 랭킹 패널 ── -->
                    <div id="panel-ranking" class="panel active">
                        <div class="filter-bar">
                            <div class="agency-tabs">
                                <button class="agency-tab active" data-agency="I_TICKET_OLD" onclick="selectAgency(this)">I-Ticket</button>
                                <button class="agency-tab" data-agency="N_TICKET" onclick="selectAgency(this)">N-Ticket</button>
                                <button class="agency-tab" data-agency="M_TICKET" onclick="selectAgency(this)">M-Ticket</button>
                                <button class="agency-tab disabled" disabled>Y-Ticket</button>
                            </div>
                        </div>

                        <div class="split-legend">
                            <span class="lg-item"><i class="lg-dot lg1"></i>반응</span>
                            <span class="lg-item"><i class="lg-dot lg2"></i>대기열</span>
                            <span class="lg-item"><i class="lg-dot lg3"></i>보안문자</span>
                            <span class="lg-item"><i class="lg-dot lg4"></i>좌석 선택</span>
                        </div>

                        <div class="ranking-table-header">
                            <table class="ranking-table">
                                <colgroup>
                                    <col style="width: 13%;">
                                    <col style="width: 40%;">
                                    <col style="width: 25%;">
                                    <col style="width: 22%;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>순위</th>
                                        <th style="text-align: left; padding-left: 30px;">닉네임</th>
                                        <th>구간 비중</th>
                                        <th>최고 기록</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>

                        <div class="ranking-table-body">
                            <table class="ranking-table">
                                <colgroup>
                                    <col style="width: 13%;">
                                    <col style="width: 40%;">
                                    <col style="width: 25%;">
                                    <col style="width: 22%;">
                                </colgroup>
                                <tbody id="rankingTableBody">
                                    <tr>
                                        <td colspan="4"
                                            style="text-align:center; padding: 40px; color: #94a3b8; font-size: 14px;">
                                            불러오는 중...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div id="rankingSentinel" class="list-sentinel" hidden>불러오는 중</div>
                        </div>

                        <div id="myRankWrap" class="my-rank-wrap" style="display: none;">
                            <div id="myRankRow" class="my-rank-row">
                                <span class="mr-rank">-</span>
                                <span class="mr-name">
                                    <span class="tier tier-sm mr-tier" hidden></span>
                                    <span class="mr-nick"></span>
                                    <span class="mr-badge">ME</span>
                                </span>
                                <span class="rank-split"></span>
                                <span class="time-badge mr-time">-<span class="badge-arrow">&#9660;</span></span>
                            </div>
                            <div id="myRankDetail" class="my-rank-detail hidden"></div>
                        </div>

                    </div>

                    <!-- ── 내 기록 패널 ── -->
                    <div id="panel-myrecord" class="panel">

                        <div class="filter-bar">
                            <div class="agency-tabs">
                                <button class="agency-tab active" data-agency="I_TICKET_OLD" onclick="selectAgency(this)">I-Ticket</button>
                                <button class="agency-tab" data-agency="N_TICKET" onclick="selectAgency(this)">N-Ticket</button>
                                <button class="agency-tab" data-agency="M_TICKET" onclick="selectAgency(this)">M-Ticket</button>
                                <button class="agency-tab disabled" disabled>Y-Ticket</button>
                            </div>
                        </div>

                        <div class="split-legend">
                            <span class="lg-item"><i class="lg-dot lg1"></i>반응</span>
                            <span class="lg-item"><i class="lg-dot lg2"></i>대기열</span>
                            <span class="lg-item"><i class="lg-dot lg3"></i>보안문자</span>
                            <span class="lg-item"><i class="lg-dot lg4"></i>좌석 선택</span>
                        </div>

                        <div class="my-stats-grid">
                            <div class="stat-card">
                                <div class="stat-label">내 등급</div>
                                <div class="tier-line">
                                    <button type="button" id="myTier" class="tier tier--f" disabled>-</button>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">상위</div>
                                <div id="myPercentile" class="stat-value highlight">-</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">내 순위</div>
                                <div id="myOverallRank" class="stat-value highlight">-</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">최고 기록</div>
                                <div id="myBestRecord" class="stat-value highlight">-</div>
                            </div>
                        </div>

                        <div class="my-record-table-header">
                            <table class="record-table">
                                <colgroup>
                                    <col style="width: 11%;">
                                    <col style="width: 36%;">
                                    <col style="width: 25%;">
                                    <col style="width: 28%;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>시도</th>
                                        <th style="text-align: left; padding-left: 20px;">날짜 / 시간</th>
                                        <th>구간 비중</th>
                                        <th>기록</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>

                        <div class="my-record-table-body">
                            <table class="record-table">
                                <colgroup>
                                    <col style="width: 11%;">
                                    <col style="width: 36%;">
                                    <col style="width: 25%;">
                                    <col style="width: 28%;">
                                </colgroup>
                                <tbody id="myRecordTableBody">
                                    <tr>
                                        <td colspan="4"
                                            style="text-align:center; padding: 40px; color: #94a3b8; font-size: 14px;">
                                            기록을 불러오는 중...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div id="myRecordSentinel" class="list-sentinel" hidden>불러오는 중</div>
                        </div>
                    </div>

                </div>
            </section>
        </div>

        <div id="tierPop" hidden></div>
    </div>

    <script type="module" src="/js/practice/list.js"></script>
</body>

</html>
