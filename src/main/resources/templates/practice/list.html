<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title>실전 연습 - 프랙티켓</title>
    <style>
        /* Layout Fixes for 100vh fit */
        .practice-hub-container {
            max-width: 1200px;
            margin: 0 auto;
            min-height: calc(100vh - 140px);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
        }


        .hub-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid #6c5ce7;
            padding-left: 10px;
            flex-shrink: 0;
        }

        /* Agency Selection Cards */
        .agency-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-shrink: 0;
            /* Keep cards fixed size preference */
        }

        .agency-card {
            width: 240px;
            height: 280px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            background-color: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid #eee;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .agency-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .agency-card.disabled {
            opacity: 0.7;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .card-image {
            height: 140px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #888;
            font-size: 22px;
        }

        .card-image.i-ticket {
            background: linear-gradient(135deg, #EC0F13 0%, #a80003 100%);
            color: white;
        }

        .card-info {
            padding: 15px;
            text-align: left;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .agency-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .agency-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }

        .status-badge {
            align-self: flex-start;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
        }

        .status-badge.active {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .status-badge.coming {
            background-color: #f5f5f5;
            color: #999;
        }

        /* Ranking Section - Fill remaining space */
        .ranking-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            /* Important for scroll if needed internally */
        }

        .ranking-section {
            background-color: #f9f9f9;
            border-radius: 12px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #ddd;
            /* styled distinctively */
        }

        .ranking-placeholder {
            padding: 20px;
            color: #888;
            font-size: 15px;
            line-height: 1.6;
        }

        @media (max-height: 700px) {

            /* Adjustments for smaller vertical screens */
            .practice-hub-container {
                padding: 10px;
            }

            .hub-title {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .agency-card {
                width: 220px;
                height: 240px;
            }

            .card-image {
                height: 110px;
            }
        }
    </style>
</head>

<body layout:fragment="content">
    <div class="practice-hub-container">
        <h1 class="hub-title">실전 티켓팅 연습</h1>

        <div class="section-title">연습할 티켓사를 선택하세요</div>
        <div class="agency-list">
            <!-- I-Ticket -->
            <a href="/practice/i-ticket/intro" class="agency-card">
                <div class="card-image i-ticket">I-Ticket</div>
                <div class="card-info">
                    <div>
                        <div class="agency-name">I-Ticket</div>
                        <div class="agency-desc">인터파크 스타일<br>예매 연습</div>
                    </div>
                    <span class="status-badge active">이용 가능</span>
                </div>
            </a>

            <!-- Melon (Placeholder) -->
            <div class="agency-card disabled">
                <div class="card-image">M-Ticket</div>
                <div class="card-info">
                    <div>
                        <div class="agency-name">M-Ticket</div>
                        <div class="agency-desc">멜론티켓 스타일<br>(준비중)</div>
                    </div>
                    <span class="status-badge coming">오픈 예정</span>
                </div>
            </div>

            <!-- Yes24 (Placeholder) -->
            <div class="agency-card disabled">
                <div class="card-image">Y-Ticket</div>
                <div class="card-info">
                    <div>
                        <div class="agency-name">Y-Ticket</div>
                        <div class="agency-desc">예스24 스타일<br>(준비중)</div>
                    </div>
                    <span class="status-badge coming">오픈 예정</span>
                </div>
            </div>
        </div>

        <div class="ranking-wrapper">
            <div class="section-title">티켓사별 명예의 전당</div>
            <div class="ranking-section">
                <p class="ranking-placeholder">
                    🚧 티켓사별 랭킹 시스템이 준비 중입니다.<br>
                    곧 실전 연습 기록을 통해 랭킹을 확인하실 수 있습니다!
                </p>
            </div>
        </div>
    </div>
</body>

</html>
