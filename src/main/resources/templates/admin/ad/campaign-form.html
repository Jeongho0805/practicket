<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('캠페인 등록')}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('campaign')}"></aside>

    <main class="main">
        <div class="crumb"><a href="/admin-hoya/ad/campaigns">캠페인</a> · <span th:text="${form.id == null} ? '등록' : '수정'">등록</span></div>

        <div class="topbar">
            <div>
                <h1 th:text="${form.id == null} ? '새 캠페인' : ${form.name}">새 캠페인</h1>
                <p>계약 한 건과 그 아래 자리별 배너를 한 화면에서 만듭니다.</p>
            </div>
        </div>

        <div class="warnbox" th:if="${error != null}" th:text="${error}">오류</div>

        <form method="post" action="/admin-hoya/ad/campaigns" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${form.id}">

            <div class="card formcard wide">
                <header><h2>계약</h2></header>

                <div class="two">
                    <div class="f">
                        <label for="advertiserId">광고주</label>
                        <select id="advertiserId" name="advertiserId" required>
                            <option value="" th:if="${#lists.isEmpty(advertisers)}">등록된 광고주가 없습니다</option>
                            <option th:each="advertiser : ${advertisers}"
                                    th:value="${advertiser.id}"
                                    th:selected="${advertiser.id == form.advertiserId}"
                                    th:text="${advertiser.name}">광고주</option>
                        </select>
                        <span class="hint">
                            없으면 <a href="/admin-hoya/ad/advertisers/new">광고주를 먼저 등록</a>해주세요.
                        </span>
                    </div>
                    <div class="f">
                        <label for="name">캠페인 이름</label>
                        <input type="text" id="name" name="name" th:value="${form.name}"
                               placeholder="8월 티켓오픈 프로모션" required>
                    </div>
                </div>

                <div class="two">
                    <div class="f">
                        <label for="startAt">계약 기간</label>
                        <div class="dates">
                            <input type="date" id="startAt" name="startAt" th:value="${form.startAt}" required>
                            <span class="sep">~</span>
                            <input type="date" name="endAt" th:value="${form.endAt}" required>
                        </div>
                    </div>
                    <div class="f">
                        <label for="amount">계약 금액 (원)</label>
                        <input type="number" id="amount" name="amount" th:value="${form.amount}" min="0" step="10000">
                    </div>
                </div>

                <div class="f">
                    <label for="linkUrl">기본 착지 주소</label>
                    <input type="url" id="linkUrl" name="linkUrl" th:value="${form.linkUrl}"
                           placeholder="https://example.com/event">
                    <span class="hint">배너가 링크를 비우면 이 주소로 보냅니다.</span>
                </div>

                <div class="f">
                    <label for="memo">메모</label>
                    <textarea id="memo" name="memo" rows="3" th:text="${form.memo}"></textarea>
                </div>
            </div>

            <div class="card formcard wide">
                <header>
                    <h2>자리별 배너</h2>
                    <button type="button" class="btn ghost sm" id="add-banner">+ 자리 추가</button>
                </header>
                <p class="note">
                    기간을 비우면 계약 기간을 따릅니다. 소재는 기기별로 따로 올립니다 —
                    한쪽만 올리면 반대 기기에서는 네트워크 광고가 대신 채웁니다.
                </p>

                <div class="bulkrows">
                    <table>
                        <thead>
                        <tr>
                            <th style="width:200px">자리</th>
                            <th style="width:220px">데스크톱 소재</th>
                            <th style="width:220px">모바일 소재</th>
                            <th style="width:220px">착지 주소</th>
                            <th style="width:210px">노출 기간</th>
                            <th style="width:110px"></th>
                        </tr>
                        </thead>
                        <tbody id="banner-rows">
                        <tr th:each="banner, iter : ${form.banners}">
                            <td>
                                <input type="hidden" th:name="'banners[' + ${iter.index} + '].id'" th:value="${banner.id}">
                                <input type="hidden" th:name="'banners[' + ${iter.index} + '].deleted'" value="false"
                                       class="deleted-flag">
                                <select th:name="'banners[' + ${iter.index} + '].slotId'">
                                    <option th:each="slot : ${slots}"
                                            th:value="${slot.id}"
                                            th:selected="${slot.id == banner.slotId}"
                                            th:text="${slot.name} + ' · ' + ${slot.code}">자리</option>
                                </select>
                            </td>
                            <td>
                                <div class="fname">
                                    <img class="thumb" th:if="${banner.pcImagePath != null}"
                                         th:src="${banner.pcImagePath}" alt="데스크톱 소재">
                                    <div class="thumb ph" th:if="${banner.pcImagePath == null}"><span>없음</span></div>
                                </div>
                                <input type="hidden" th:name="'banners[' + ${iter.index} + '].pcImagePath'"
                                       th:value="${banner.pcImagePath}">
                                <input type="file" th:name="'banners[' + ${iter.index} + '].pcImage'" accept="image/*">
                                <label class="checkrow" th:if="${banner.pcImagePath != null}">
                                    <input type="checkbox" th:name="'banners[' + ${iter.index} + '].clearPcImage'" value="true">
                                    소재 떼기
                                </label>
                            </td>
                            <td>
                                <div class="fname">
                                    <img class="thumb" th:if="${banner.mobileImagePath != null}"
                                         th:src="${banner.mobileImagePath}" alt="모바일 소재">
                                    <div class="thumb ph" th:if="${banner.mobileImagePath == null}"><span>없음</span></div>
                                </div>
                                <input type="hidden" th:name="'banners[' + ${iter.index} + '].mobileImagePath'"
                                       th:value="${banner.mobileImagePath}">
                                <input type="file" th:name="'banners[' + ${iter.index} + '].mobileImage'" accept="image/*">
                                <label class="checkrow" th:if="${banner.mobileImagePath != null}">
                                    <input type="checkbox" th:name="'banners[' + ${iter.index} + '].clearMobileImage'" value="true">
                                    소재 떼기
                                </label>
                            </td>
                            <td>
                                <input type="url" th:name="'banners[' + ${iter.index} + '].linkUrl'"
                                       th:value="${banner.linkUrl}" placeholder="비우면 계약 기본 주소">
                            </td>
                            <td>
                                <div class="percell">
                                    <div class="dates2">
                                        <input type="date" th:name="'banners[' + ${iter.index} + '].startAt'"
                                               th:value="${banner.startAt}">
                                        <span class="sep">~</span>
                                        <input type="date" th:name="'banners[' + ${iter.index} + '].endAt'"
                                               th:value="${banner.endAt}">
                                    </div>
                                    <span class="txt">비우면 계약 기간을 따릅니다</span>
                                </div>
                            </td>
                            <td>
                                <label class="checkrow">
                                    <input type="hidden" th:name="'_banners[' + ${iter.index} + '].enabled'" value="on">
                                    <input type="checkbox" th:name="'banners[' + ${iter.index} + '].enabled'"
                                           value="true" th:checked="${banner.enabled}">
                                    노출
                                </label>
                                <button type="button" class="linkbtn remove-banner">이 자리 빼기</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="formactions">
                <a class="btn ghost" href="/admin-hoya/ad/campaigns">취소</a>
                <button type="submit" class="btn">저장</button>
            </div>
        </form>
    </main>
</div>

<template id="banner-row-template">
    <tr>
        <td>
            <input type="hidden" name="banners[__i__].id" value="">
            <input type="hidden" name="banners[__i__].deleted" value="false" class="deleted-flag">
            <select name="banners[__i__].slotId">
                <option th:each="slot : ${slots}" th:value="${slot.id}"
                        th:text="${slot.name} + ' · ' + ${slot.code}">자리</option>
            </select>
        </td>
        <td>
            <div class="fname"><div class="thumb ph"><span>없음</span></div></div>
            <input type="hidden" name="banners[__i__].pcImagePath" value="">
            <input type="file" name="banners[__i__].pcImage" accept="image/*">
        </td>
        <td>
            <div class="fname"><div class="thumb ph"><span>없음</span></div></div>
            <input type="hidden" name="banners[__i__].mobileImagePath" value="">
            <input type="file" name="banners[__i__].mobileImage" accept="image/*">
        </td>
        <td>
            <input type="url" name="banners[__i__].linkUrl" placeholder="비우면 계약 기본 주소">
        </td>
        <td>
            <div class="percell">
                <div class="dates2">
                    <input type="date" name="banners[__i__].startAt">
                    <span class="sep">~</span>
                    <input type="date" name="banners[__i__].endAt">
                </div>
                <span class="txt">비우면 계약 기간을 따릅니다</span>
            </div>
        </td>
        <td>
            <label class="checkrow">
                <input type="hidden" name="_banners[__i__].enabled" value="on">
                <input type="checkbox" name="banners[__i__].enabled" value="true" checked>
                노출
            </label>
            <button type="button" class="linkbtn remove-banner">이 자리 빼기</button>
        </td>
    </tr>
</template>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
<script>
    // 인덱스가 비어도 서버가 리스트를 채우므로 재정렬하지 않는다. 지운 줄은 감춘 뒤 deleted=true 로 보낸다.
    const rows = document.getElementById('banner-rows');
    const template = document.getElementById('banner-row-template');
    let nextIndex = rows.querySelectorAll('tr').length;

    document.getElementById('add-banner').addEventListener('click', () => {
        const html = template.innerHTML.replaceAll('__i__', nextIndex++);
        const holder = document.createElement('tbody');
        holder.innerHTML = html;
        rows.appendChild(holder.firstElementChild);
    });

    rows.addEventListener('click', (event) => {
        if (!event.target.classList.contains('remove-banner')) return;
        const row = event.target.closest('tr');
        row.querySelector('.deleted-flag').value = 'true';
        row.style.display = 'none';
    });
</script>
</body>
</html>
