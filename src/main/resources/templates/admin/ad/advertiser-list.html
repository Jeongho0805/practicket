<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('광고주')}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('advertiser')}"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>광고주</h1>
                <p>거래처마다 캠페인 이력과 누적 금액을 한곳에서 봅니다.</p>
            </div>
            <div class="tools">
                <a class="btn" href="/admin-hoya/ad/advertisers/new">+ 광고주 등록</a>
            </div>
        </div>

        <div class="warnbox" th:if="${error != null}" th:text="${error}">오류</div>

        <div class="card">
            <header>
                <h2>거래처<small th:text="${#lists.size(rows)} + '곳'">0곳</small></h2>
                <span class="note">이름은 중복될 수 없습니다 — 같은 거래처가 두 번 생기면 합칠 방법이 없습니다</span>
            </header>

            <div class="tablewrap" th:if="${not #lists.isEmpty(rows)}">
                <table>
                    <thead>
                    <tr>
                        <th>광고주</th>
                        <th class="r">캠페인</th>
                        <th>집행 기간</th>
                        <th class="r">누적 금액</th>
                        <th class="r">노출</th>
                        <th class="r">CTR</th>
                        <th>현재</th>
                        <th class="r"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${rows}" class="rowlink"
                        th:onclick="|location.href='/admin-hoya/ad/advertisers/${row.advertiser.id}'|">
                        <td>
                            <b th:text="${row.advertiser.name}">광고주</b>
                            <div class="note" th:if="${row.advertiser.manager != null}"
                                 th:text="${row.advertiser.manager}">담당자</div>
                        </td>
                        <td class="r" th:text="${row.campaigns} + '개'">0개</td>
                        <td>
                            <span th:if="${row.firstStart != null}"
                                  th:text="${#temporals.format(row.firstStart, 'yyyy.MM.dd')} + ' ~ '
                                           + ${#temporals.format(row.lastEnd, 'yyyy.MM.dd')}">기간</span>
                            <span class="note" th:if="${row.firstStart == null}">-</span>
                        </td>
                        <td class="r money" th:text="${#numbers.formatInteger(row.amount, 1, 'COMMA')} + '원'">0원</td>
                        <td class="r" th:text="${#numbers.formatInteger(row.impressions, 1, 'COMMA')}">0</td>
                        <td class="r"><b th:text="${#numbers.formatDecimal(row.ctr, 1, 2, 'POINT')} + '%'">0.00%</b></td>
                        <td>
                            <span class="pill live" th:if="${row.liveCampaigns > 0}">
                                <i></i><span th:text="'진행 ' + ${row.liveCampaigns}">진행</span>
                            </span>
                            <span class="pill off" th:if="${row.liveCampaigns == 0}"><i></i>없음</span>
                        </td>
                        <td class="r">
                            <div class="rowact">
                                <a class="btn ghost sm"
                                   th:href="@{/admin-hoya/ad/advertisers/{id}(id=${row.advertiser.id})}">상세</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty" th:if="${#lists.isEmpty(rows)}">
                등록된 광고주가 없습니다.
                <a href="/admin-hoya/ad/advertisers/new">첫 광고주를 등록</a>해보세요.
            </div>
        </div>
    </main>
</div>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
</body>
</html>
