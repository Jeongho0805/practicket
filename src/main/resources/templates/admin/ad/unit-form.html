<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('광고단위')}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('unit')}"></aside>

    <main class="main">
        <div class="crumb"><a href="/admin-hoya/ad/units">광고 설정</a> · <span th:text="${unit == null} ? '추가' : '수정'">추가</span></div>

        <div class="topbar">
            <div>
                <h1 th:text="${unit == null} ? '광고단위 추가' : '광고단위 수정'">광고단위 추가</h1>
                <p>쿠팡·애드센스는 반응형으로 표시하고, 애드핏은 발급받은 규격을 선택합니다.</p>
            </div>
        </div>

        <div class="warnbox" th:if="${error != null}" th:text="${error}">오류</div>

        <form method="post" action="/admin-hoya/ad/units">
            <input type="hidden" name="id" th:if="${unit != null}" th:value="${unit.id}">

            <div class="card formcard">
                <div>
                    <div class="f">
                        <label for="network">네트워크</label>
                        <select id="network" name="network" required>
                            <option th:each="network : ${networks}" th:value="${network}"
                                    th:selected="${unit != null and network == unit.network}"
                                    th:text="${networkLabels[network] != null ? networkLabels[network] : network}">네트워크</option>
                        </select>
                        <span class="hint" id="netHint">규격을 안 가리는 네트워크입니다 — 등록한 단위가 모든 슬롯을 덮습니다.</span>
                    </div>
                    <div class="f">
                        <label for="adfitSize">규격</label>
                        <div id="responsiveSize"><span class="tag resp">반응형 · 슬롯 크기에 맞춰 표시</span></div>
                        <select id="adfitSize" hidden>
                            <option value="">규격을 고르세요</option>
                            <option value="320x480">320x480 · 모바일 세로형</option>
                            <option value="320x100">320x100 · 모바일 띠</option>
                            <option value="320x50">320x50 · 모바일 얇은 띠</option>
                            <option value="728x90">728x90 · PC 가로형</option>
                            <option value="300x250">300x250 · PC/모바일 겸용</option>
                            <option value="250x250">250x250 · 정사각형</option>
                            <option value="160x600">160x600 · PC 세로형</option>
                        </select>
                        <input type="hidden" id="width" name="width" th:value="${unit != null ? unit.width : null}">
                        <input type="hidden" id="height" name="height" th:value="${unit != null ? unit.height : null}">
                        <span class="hint" id="sizeHint" hidden>카카오 애드핏에서 발급받은 광고단위의 규격을 선택하세요.</span>
                    </div>
                </div>

                <div>
                    <div class="f">
                        <label for="unitId">광고단위 ID</label>
                        <input type="text" id="unitId" name="unitId"
                               th:value="${unit != null ? unit.unitId : null}" required
                               placeholder="943782 / 9697904962 / DAN-xxxxxxxx">
                    </div>
                    <div class="f">
                        <label for="name">이름 (선택)</label>
                        <input type="text" id="name" name="name" th:value="${unit != null ? unit.name : null}"
                               placeholder="모바일 띠">
                        <span class="hint">비워두면 목록에 ID 가 그대로 나옵니다.</span>
                    </div>
                </div>
            </div>

            <div class="formactions">
                <a class="btn ghost" href="/admin-hoya/ad/units">취소</a>
                <button type="submit" class="btn">저장</button>
            </div>
        </form>
    </main>
</div>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
<script>
    // 애드핏은 카카오가 정한 일곱 규격 밖을 못 쓴다. 손으로 치면 오타가 나므로 골라서 채운다.
    (function () {
        const network = document.getElementById('network');
        const size = document.getElementById('adfitSize');
        const width = document.getElementById('width');
        const height = document.getElementById('height');
        const responsiveSize = document.getElementById('responsiveSize');
        const sizeHint = document.getElementById('sizeHint');

        const netHint = document.getElementById('netHint');

        function sync() {
            const fixed = network.value === 'ADFIT';
            size.hidden = !fixed;
            size.required = fixed;
            responsiveSize.hidden = fixed;
            sizeHint.hidden = !fixed;
            width.disabled = !fixed;
            height.disabled = !fixed;
            netHint.textContent = network.value === 'ADFIT'
                ? '규격이 고정된 네트워크입니다 — 슬롯 안에 들어가는 단위만 걸립니다.'
                : '규격을 안 가리는 네트워크입니다 — 등록한 단위가 모든 슬롯을 덮습니다.';
            if (!size.hidden) {
                const current = width.value && height.value ? width.value + 'x' + height.value : '';
                if (current && !Array.from(size.options).some(option => option.value === current)) {
                    size.add(new Option(current + ' · 기존 등록 규격', current));
                }
                size.value = current;
            }
        }

        size.addEventListener('change', function () {
            if (!size.value) {
                width.value = '';
                height.value = '';
                return;
            }
            const [w, h] = size.value.split('x');
            width.value = w;
            height.value = h;
        });
        network.addEventListener('change', sync);
        sync();
    })();
</script>
</body>
</html>
