<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('슬롯 수정')}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('slot')}"></aside>

    <main class="main">
        <div class="crumb"><a href="/admin-hoya/ad/slots">슬롯</a> · 수정</div>

        <div class="topbar">
            <div>
                <h1 th:text="${form.name}">슬롯</h1>
                <p>규격을 비우면 그 기기에서는 이 슬롯이 아예 안 나갑니다.</p>
            </div>
        </div>

        <div class="warnbox" th:if="${error != null}" th:text="${error}">오류</div>
        <div class="warnbox" th:if="${unitWarning != null}" th:text="${unitWarning}">경고</div>

        <form method="post" action="/admin-hoya/ad/slots">
            <input type="hidden" name="id" th:value="${form.id}">

            <div class="card formcard">
                <div class="two">
                    <div class="f">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" th:value="${form.name}" required>
                    </div>
                    <div class="f">
                        <label for="format">형식</label>
                        <input type="text" id="format" name="format" th:value="${form.format}"
                               placeholder="디스플레이 / 인피드 / 인아티클 / 멀티플렉스">
                    </div>
                </div>

                <div class="two">
                    <div class="f">
                        <label for="pcWidth">데스크톱 규격</label>
                        <div class="dates">
                            <input type="number" id="pcWidth" name="pcWidth" th:value="${form.pcWidth}" placeholder="가로" min="0">
                            <span class="sep">x</span>
                            <input type="number" name="pcHeight" th:value="${form.pcHeight}" placeholder="세로" min="0">
                        </div>
                        <span class="hint">비우면 데스크톱에서는 안 나갑니다.</span>
                    </div>
                    <div class="f">
                        <label for="mobileWidth">모바일 규격</label>
                        <div class="dates">
                            <input type="number" id="mobileWidth" name="mobileWidth" th:value="${form.mobileWidth}" placeholder="가로" min="0">
                            <span class="sep">x</span>
                            <input type="number" name="mobileHeight" th:value="${form.mobileHeight}" placeholder="세로" min="0">
                        </div>
                        <span class="hint">비우면 모바일에서는 안 나갑니다.</span>
                    </div>
                </div>

                <div class="two">
                    <div class="f">
                        <label for="groupName">묶음 이름</label>
                        <input type="text" id="groupName" name="groupName" th:value="${form.groupName}"
                               placeholder="전 페이지 공통">
                    </div>
                    <div class="f">
                        <label for="groupPath">묶음 경로</label>
                        <input type="text" id="groupPath" name="groupPath" th:value="${form.groupPath}"
                               placeholder="GLOBAL 또는 /community">
                    </div>
                </div>

                <div class="two">
                    <div class="f">
                        <label for="fillNetwork">미판매 시 채울 네트워크</label>
                        <select id="fillNetwork" name="fillNetwork">
                            <option value="">비워둠 (아무것도 안 그림)</option>
                            <option th:each="network : ${networks}" th:value="${network}"
                                    th:selected="${network == form.fillNetwork}"
                                    th:text="${networkLabels[network] != null ? networkLabels[network] : network}">네트워크</option>
                        </select>
                    </div>
                    <div class="f">
                        <label for="sortOrder">정렬 순서</label>
                        <input type="number" id="sortOrder" name="sortOrder" th:value="${form.sortOrder}" min="0">
                    </div>
                </div>

                <div class="two">
                    <div class="f">
                        <label for="pcAdUnitId">데스크톱 광고단위</label>
                        <select id="pcAdUnitId" name="pcAdUnitId">
                            <option value="">자동 (규격에 맞는 가장 큰 단위)</option>
                            <option th:each="unit : ${units}" th:value="${unit.id}"
                                    th:attr="data-network=${unit.network}"
                                    th:selected="${unit.id == form.pcAdUnitId}"
                                    th:text="${unit.pcLabel()}">단위</option>
                        </select>
                        <span class="hint" th:if="${form.pcWidth == null or form.pcHeight == null}">
                            규격이 비어 있어 데스크톱에서는 안 나갑니다.</span>
                    </div>
                    <div class="f">
                        <label for="mobileAdUnitId">모바일 광고단위</label>
                        <select id="mobileAdUnitId" name="mobileAdUnitId">
                            <option value="">자동 (규격에 맞는 가장 큰 단위)</option>
                            <option th:each="unit : ${units}" th:value="${unit.id}"
                                    th:attr="data-network=${unit.network}"
                                    th:selected="${unit.id == form.mobileAdUnitId}"
                                    th:text="${unit.mobileLabel()}">단위</option>
                        </select>
                        <span class="hint" th:if="${form.mobileWidth == null or form.mobileHeight == null}">
                            규격이 비어 있어 모바일에서는 안 나갑니다.</span>
                    </div>
                </div>
            </div>

            <div class="formactions">
                <a class="btn ghost" href="/admin-hoya/ad/slots">취소</a>
                <button type="submit" class="btn">저장</button>
            </div>
        </form>
    </main>
</div>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
<script>
    (() => {
        const network = document.getElementById('fillNetwork');
        const selects = ['pcAdUnitId', 'mobileAdUnitId'].map(id => document.getElementById(id));
        const options = selects.map(select => Array.from(select.options));
        function sync(reset) {
            selects.forEach((select, index) => {
                const previous = reset ? '' : select.value;
                select.replaceChildren(...options[index].filter(option =>
                    !option.value || option.dataset.network === network.value));
                select.value = Array.from(select.options).some(option => option.value === previous) ? previous : '';
            });
        }
        network.addEventListener('change', () => sync(true));
        sync(false);
    })();
</script>
</body>
</html>
