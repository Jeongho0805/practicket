<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head(${banner != null ? '배너 수정' : '배너 등록'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('banner')}"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1 th:text="${banner != null ? '배너 수정' : '새 배너 등록'}">새 배너 등록</h1>
                <p th:text="${banner != null ? '이미지를 바꾸지 않으려면 파일 칸을 비워두세요.' : '이미지를 올리고 슬롯과 게재 기간을 지정합니다.'}">
                    이미지를 올리고 슬롯과 게재 기간을 지정합니다.</p>
            </div>
            <a class="btn ghost" href="/admin-hoya/ad/banners">목록으로</a>
        </div>

        <div th:if="${error}" class="alert" th:text="${error}"></div>

        <div class="card formcard">
            <div class="pad">
                <form th:action="${banner != null ? '/admin-hoya/ad/banners/' + banner.id : '/admin-hoya/ad/banners'}"
                      method="post" enctype="multipart/form-data">

                    <div class="f">
                        <label for="slotId">슬롯</label>
                        <select id="slotId" name="slotId" required>
                            <option th:each="slot : ${slots}"
                                    th:value="${slot.id}"
                                    th:text="${slot.name} + ' (' + ${slot.code} + ', ' + ${slot.recommendedSize} + ')'"
                                    th:selected="${banner != null and banner.slot != null and banner.slot.id == slot.id}">
                            </option>
                        </select>
                    </div>

                    <!-- 같은 슬롯·같은 기간에 배너가 이미 있으면 로테이션된다는 사실을 알린다(막지는 않음). -->
                    <div class="warnbox hide" id="overlap-warning"></div>

                    <div class="f" th:if="${banner != null and banner.imagePath != null}">
                        <label>현재 이미지</label>
                        <div class="preview">
                            <img th:src="${banner.imagePath}" alt="현재 배너 이미지"/>
                        </div>
                    </div>

                    <div class="f">
                        <label for="image">배너 이미지</label>
                        <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png,.gif"
                               th:required="${banner == null}"/>
                        <p class="hint">jpg / jpeg / png / gif · 최대 2MB<span th:if="${banner != null}"> · 비워두면 기존 이미지를 유지합니다</span></p>
                    </div>

                    <div class="f">
                        <label for="advertiserName">광고주명</label>
                        <input type="text" id="advertiserName" name="advertiserName" required
                               list="advertiser-names" autocomplete="off"
                               placeholder="예: 모두컴퍼니"
                               th:value="${banner != null ? banner.advertiserName : ''}"/>
                        <datalist id="advertiser-names">
                            <option th:each="name : ${advertiserNames}" th:value="${name}"></option>
                        </datalist>
                        <p class="hint">이름이 곧 광고주 식별자입니다. 기존 광고주면 <b>목록에서 그대로 골라주세요</b> — 표기가 다르면 성과가 갈라집니다.</p>
                    </div>

                    <div class="f">
                        <label for="linkUrl">링크 URL</label>
                        <input type="url" id="linkUrl" name="linkUrl" required
                               placeholder="https://"
                               th:value="${banner != null ? banner.linkUrl : ''}"/>
                        <p class="hint">클릭 시 UTM 파라미터가 붙어 이 주소로 이동합니다.</p>
                    </div>

                    <div class="two">
                        <div class="f">
                            <label for="startAt">시작일</label>
                            <input type="date" id="startAt" name="startAt" required
                                   th:value="${banner != null ? banner.startAt : ''}"/>
                        </div>
                        <div class="f">
                            <label for="endAt">종료일</label>
                            <input type="date" id="endAt" name="endAt" required
                                   th:value="${banner != null ? banner.endAt : ''}"/>
                        </div>
                    </div>

                    <div class="f checkrow">
                        <input type="checkbox" id="enabled" name="enabled" value="true"
                               th:checked="${banner == null or banner.enabled}"/>
                        <label for="enabled">노출 켜기 (기간에 들어오면 바로 게재)</label>
                    </div>

                    <div class="formactions">
                        <button type="submit" class="btn" th:text="${banner != null ? '수정 저장' : '등록'}">등록</button>
                        <a class="btn ghost" href="/admin-hoya/ad/banners">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
<script th:inline="javascript">
    // 슬롯 겹침 경고. 서버 왕복 없이 슬롯·기간을 바꿀 때마다 다시 계산한다.
    // 날짜는 ISO 문자열(yyyy-MM-dd)이라 문자열 비교만으로 앞뒤가 정확히 가려진다.
    (function () {
        const OCCUPANCIES = /*[[${occupancies}]]*/ [];
        const CURRENT_ID = /*[[${banner != null ? banner.id : null}]]*/ null;

        const slot = document.getElementById('slotId');
        const start = document.getElementById('startAt');
        const end = document.getElementById('endAt');
        const box = document.getElementById('overlap-warning');
        const enabled = document.getElementById('enabled');

        function overlapping() {
            if (!start.value || !end.value) return [];
            const slotId = Number(slot.value);
            return OCCUPANCIES.filter(o =>
                o.slotId === slotId
                && o.bannerId !== CURRENT_ID
                && o.startAt <= end.value && o.endAt >= start.value);
        }

        function refresh() {
            // 노출을 끄고 등록하면 로테이션에 끼지 않으니 경고할 이유가 없다.
            const conflicts = enabled.checked ? overlapping() : [];
            if (conflicts.length === 0) {
                box.classList.add('hide');
                return;
            }

            const total = conflicts.length + 1;
            const slotName = slot.options[slot.selectedIndex].text;
            box.innerHTML =
                `⚠️ <b>${slotName}</b> 자리에 기간이 겹치는 배너가 ${conflicts.length}개 있습니다.`
                + `<ul>${conflicts.map(o => `<li>${o.advertiserName} · ${o.startAt} ~ ${o.endAt}</li>`).join('')}</ul>`
                + `<div style="margin-top:8px">이대로 등록하면 <b>${total}개가 1분 단위로 번갈아 노출</b>되어 `
                + `각 배너의 노출이 약 <b>1/${total}로 줄어듭니다.</b> `
                + `단독 노출로 판매한 자리라면 기간을 겹치지 않게 잡으세요.</div>`;
            box.classList.remove('hide');
        }

        [slot, start, end, enabled].forEach(el => {
            el.addEventListener('change', refresh);
            el.addEventListener('input', refresh);
        });
        refresh();
    })();
</script>
</body>
</html>
