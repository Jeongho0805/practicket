<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>배너 관리 - 프랙티켓 어드민</title>
    <style>
        :root { --brand: #514897; --brand-dark: #3c356f; --bg: #f6f5fb; --border: #e2e0ef; --text: #222; --muted: #777; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--brand); color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 18px; margin: 0; }
        nav a { color: #fff; text-decoration: none; margin-left: 16px; font-size: 14px; opacity: .9; }
        nav a.active, nav a:hover { opacity: 1; text-decoration: underline; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; border: none; background: var(--brand); color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: var(--brand-dark); }
        .btn.secondary { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
        .btn.danger { background: #fff; color: #c0392b; border: 1px solid #c0392b; }
        .btn.small { padding: 4px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; vertical-align: middle; }
        th { background: #f0eef8; color: var(--brand-dark); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .thumb { width: 90px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); background: #fafafa; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .badge.on { background: #e6f6ec; color: #1e8449; }
        .badge.off { background: #f5eaea; color: #c0392b; }
        .actions form { display: inline; }
        .muted { color: var(--muted); }
        .empty { text-align: center; padding: 40px; color: var(--muted); }
        .alert { background: #fdecea; color: #c0392b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
        .report-link { font-size: 12px; color: var(--brand); word-break: break-all; }
    </style>
</head>
<body>
<header>
    <h1>프랙티켓 어드민 · 광고 관리</h1>
    <nav>
        <a class="active" href="/admin-hoya/ad/banners">배너</a>
        <a href="/admin-hoya/ad/slots">슬롯</a>
    </nav>
</header>
<main>
    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <div class="toolbar">
        <h2 style="margin:0;font-size:16px;">배너 목록</h2>
        <a class="btn" href="/admin-hoya/ad/banners/new">+ 새 배너 등록</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>썸네일</th>
            <th>슬롯</th>
            <th>광고주</th>
            <th>기간</th>
            <th>상태</th>
            <th>리포트 링크</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="banner : ${banners}">
            <td><img class="thumb" th:src="${banner.imagePath}" alt="배너 이미지"/></td>
            <td th:text="${banner.slot != null ? banner.slot.name : '-'}"></td>
            <td th:text="${banner.advertiserName}"></td>
            <td>
                <span th:text="${banner.startAt}"></span> ~ <span th:text="${banner.endAt}"></span>
            </td>
            <td>
                <span th:if="${banner.enabled}" class="badge on">노출중</span>
                <span th:unless="${banner.enabled}" class="badge off">중지</span>
            </td>
            <td>
                <a class="report-link" th:href="@{'/ad/report/' + ${banner.reportToken}}" target="_blank" th:text="${'/ad/report/' + banner.reportToken}"></a>
            </td>
            <td class="actions">
                <a class="btn secondary small" th:href="@{'/admin-hoya/ad/banners/' + ${banner.id} + '/edit'}">수정</a>
                <form th:action="@{'/admin-hoya/ad/banners/' + ${banner.id} + '/toggle'}" method="post">
                    <button type="submit" class="btn secondary small" th:text="${banner.enabled ? '중지' : '재개'}"></button>
                </form>
                <form th:action="@{'/admin-hoya/ad/banners/' + ${banner.id} + '/delete'}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn danger small">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(banners)}">등록된 배너가 없습니다.</div>
</main>
</body>
</html>
