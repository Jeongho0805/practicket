<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('슬롯')}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('slot')}"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>슬롯</h1>
                <p>판매된 배너가 먼저 나가고, 미판매 시 선택한 네트워크의 광고단위로 채웁니다. 선택을 바꾸면 바로 저장됩니다.</p>
            </div>
        </div>

        <div class="warnbox" th:if="${error != null}" th:text="${error}">오류</div>

        <div class="card" th:each="group : ${groups}">
            <header>
                <div class="grouphead">
                    <h2 th:text="${group.name}">묶음</h2>
                    <span class="mono" th:if="${group.path != null}" th:text="${group.path}">/path</span>
                </div>
                <span class="note" th:text="${#lists.size(group.slots)} + '개 슬롯'">0개 슬롯</span>
            </header>

            <div class="tablewrap">
                <table class="slottable">
                    <thead>
                    <tr>
                        <th class="place">슬롯</th>
                        <th class="fill">미판매 시</th>
                        <th class="ucol">데스크톱 슬롯</th>
                        <th class="ucol">모바일 슬롯</th>
                        <th>지금</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${group.slots}">
                        <td class="place">
                            <b th:text="${row.slot.name}">슬롯</b>
                            <div class="meta" th:text="${row.slot.format != null ? row.slot.format : '-'}">디스플레이</div>
                            <div class="slotcode" th:text="${row.slot.code}">CODE</div>
                        </td>
                        <td class="fill">
                            <form method="post" th:action="@{/admin-hoya/ad/slots/{id}/fill(id=${row.slot.id})}">
                                <select name="fillNetwork" class="inlinesel" onchange="this.form.requestSubmit()"
                                        th:attr="aria-label=${row.slot.name} + ' 미판매 네트워크'">
                                    <option value="" th:selected="${row.slot.fillNetwork == null}">비워두기</option>
                                    <option th:each="entry : ${networkLabels}" th:value="${entry.key}"
                                            th:selected="${entry.key == row.slot.fillNetwork}"
                                            th:text="${entry.value}">네트워크</option>
                                </select>
                            </form>
                        </td>
                        <td class="ucol">
                            <form method="post" th:id="'slot-units-' + ${row.slot.id}"
                                  th:action="@{/admin-hoya/ad/slots/{id}/units(id=${row.slot.id})}">
                                <input type="hidden" name="fillNetwork" th:value="${row.slot.fillNetwork}">
                            </form>
                            <div class="ucell" th:if="${row.pcSize != null}">
                                <b class="usize mono" th:text="${row.pcSize}">300x600</b>
                                <select name="pcAdUnitId" class="inlinesel"
                                        th:if="${row.slot.fillNetwork != null}"
                                        th:attr="form='slot-units-' + ${row.slot.id},aria-label=${row.slot.name} + ' 데스크톱 광고단위'"
                                        onchange="this.form.requestSubmit()">
                                    <option value="">자동 (규격에 맞춰 선택)</option>
                                    <option th:each="unit : ${units}" th:if="${unit.network == row.slot.fillNetwork}"
                                            th:value="${unit.id}" th:selected="${unit.id == row.slot.pcAdUnitId}"
                                            th:text="${unit.unitId + (unit.name != null ? ' · ' + unit.name : '') + (unit.fitsIn(row.slot.pcWidth, row.slot.pcHeight) ? '' : ' · 슬롯보다 큼')}">단위</option>
                                </select>
                                <span class="usize mono" th:if="${row.pcUnit != null and row.slot.pcAdUnitId == null}"
                                      th:text="${row.pcUnit.unitId}">unit</span>
                                <span class="unm" th:if="${row.pcUnit != null and row.pcUnit.name != null and row.slot.pcAdUnitId == null}"
                                      th:text="${row.pcUnit.name}">이름</span>
                                <span class="tag resp" th:if="${row.pcUnit != null and row.pcUnit.responsive}"><i></i>반응형</span>
                                <span class="tag miss" th:if="${row.pcUnitMissing}"><i></i>단위 없음</span>
                                <span class="tag inherit" th:if="${row.pcUnit == null and !row.pcUnitMissing}"><i></i>채우지 않음</span>
                            </div>
                            <span class="note" th:if="${row.pcSize == null}">데스크톱 안 나감</span>
                        </td>
                        <td class="ucol">
                            <div class="ucell" th:if="${row.mobileSize != null}">
                                <b class="usize mono" th:text="${row.mobileSize}">320x100</b>
                                <select name="mobileAdUnitId" class="inlinesel"
                                        th:if="${row.slot.fillNetwork != null}"
                                        th:attr="form='slot-units-' + ${row.slot.id},aria-label=${row.slot.name} + ' 모바일 광고단위'"
                                        onchange="this.form.requestSubmit()">
                                    <option value="">자동 (규격에 맞춰 선택)</option>
                                    <option th:each="unit : ${units}" th:if="${unit.network == row.slot.fillNetwork}"
                                            th:value="${unit.id}" th:selected="${unit.id == row.slot.mobileAdUnitId}"
                                            th:text="${unit.unitId + (unit.name != null ? ' · ' + unit.name : '') + (unit.fitsIn(row.slot.mobileWidth, row.slot.mobileHeight) ? '' : ' · 슬롯보다 큼')}">단위</option>
                                </select>
                                <span class="usize mono" th:if="${row.mobileUnit != null and row.slot.mobileAdUnitId == null}"
                                      th:text="${row.mobileUnit.unitId}">unit</span>
                                <span class="unm" th:if="${row.mobileUnit != null and row.mobileUnit.name != null and row.slot.mobileAdUnitId == null}"
                                      th:text="${row.mobileUnit.name}">이름</span>
                                <span class="tag resp" th:if="${row.mobileUnit != null and row.mobileUnit.responsive}"><i></i>반응형</span>
                                <span class="tag miss" th:if="${row.mobileUnitMissing}"><i></i>단위 없음</span>
                                <span class="tag inherit" th:if="${row.mobileUnit == null and !row.mobileUnitMissing}"><i></i>채우지 않음</span>
                            </div>
                            <span class="note" th:if="${row.mobileSize == null}">모바일 안 나감</span>
                        </td>
                        <td>
                            <span class="pill live" th:if="${row.sold}">
                                <i></i><span th:text="'판매중 ' + ${row.liveBannerCount}">판매중</span>
                            </span>
                            <span class="pill off" th:unless="${row.sold}"><i></i>미판매</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" th:if="${#lists.isEmpty(groups)}">
            <div class="empty">등록된 슬롯이 없습니다.</div>
        </div>
    </main>
</div>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
</body>
</html>
