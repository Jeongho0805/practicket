<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  어드민 공용 셸. admin/ad/* 페이지가 head/sidebar/toast를 재사용한다.
  layout/default를 decorate하지 않는 standalone 구조라 여기서 css를 직접 링크한다.
  사이드바 배지 숫자는 AdminNavAdvice가 넣어주는 navBannerCount/navSlotCount를 읽는다.
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${pageTitle} + ' · 프랙티켓 어드민'">프랙티켓 어드민</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<aside th:fragment="sidebar(active)" class="side">
    <a class="logo" href="/admin-hoya/ad">
        <span class="mark">P</span>
        <span><b>프랙티켓</b><small>ADMIN CONSOLE</small></span>
    </a>

    <nav class="navgroup">
        <div class="cap">광고 운영</div>
        <a class="nav" th:classappend="${active == 'dash'} ? 'on'" href="/admin-hoya/ad">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            대시보드
        </a>
        <a class="nav" th:classappend="${active == 'banner'} ? 'on'" href="/admin-hoya/ad/banners">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>
            배너
            <span class="count" th:if="${navBannerCount != null}" th:text="${navBannerCount}">0</span>
        </a>
        <a class="nav" th:classappend="${active == 'slot'} ? 'on'" href="/admin-hoya/ad/slots">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="10" height="6" rx="1"/></svg>
            슬롯
            <span class="count" th:if="${navSlotCount != null}" th:text="${navSlotCount}">0</span>
        </a>
        <a class="nav" th:classappend="${active == 'advertiser'} ? 'on'" href="/admin-hoya/ad/advertisers">
            <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.9"/></svg>
            광고주
        </a>
    </nav>

    <nav class="navgroup">
        <div class="cap">사이트 운영</div>
        <a class="nav" th:classappend="${active == 'notice'} ? 'on'" href="/admin-hoya/notices">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8"/><path d="M8 12h5"/></svg>
            공지
            <span class="count" th:if="${navNoticeCount != null}" th:text="${navNoticeCount}">0</span>
        </a>
    </nav>

    <div class="foot">
        <span class="avatar">호</span>
        <span class="who">관리자<span>프랙티켓 광고</span></span>
        <form action="/admin-hoya/logout" method="get">
            <button type="submit">로그아웃</button>
        </form>
    </div>
</aside>

<div th:fragment="toast" class="toast" id="toast"></div>

<script th:fragment="toastScript">
    function showToast(message) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function copyReportLink(button, path) {
        const url = window.location.origin + path;
        navigator.clipboard.writeText(url)
            .then(() => showToast('리포트 링크를 복사했습니다'))
            .catch(() => showToast('복사에 실패했습니다. 링크를 직접 선택해 복사해주세요.'));
    }
</script>

</body>
</html>
