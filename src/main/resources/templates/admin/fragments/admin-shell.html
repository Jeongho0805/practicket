<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  어드민 공용 셸. admin/ad/* 페이지가 head/sidebar/toast를 재사용한다.
  layout/default를 decorate하지 않는 standalone 구조라 여기서 css를 직접 링크한다.
  사이드바 배지 숫자는 AdminNavAdvice가 넣어주는 navBannerCount/navSlotCount를 읽는다.
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${pageTitle} + ' - 프랙티켓 어드민'">프랙티켓 어드민</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<aside th:fragment="sidebar(active)" class="side">
    <a class="logo" href="/admin-hoya/ad">
        <span class="mark">P</span>
        <span><b>프랙티켓</b><small>ADMIN CONSOLE</small></span>
    </a>

    <nav class="navgroup">
        <div class="cap">광고 운영</div>
        <a class="nav" th:classappend="${active == 'dash'} ? 'on'" href="/admin-hoya/ad">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            대시보드
        </a>
        <a class="nav" th:classappend="${active == 'campaign'} ? 'on'" href="/admin-hoya/ad/campaigns">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>
            캠페인
            <span class="count" th:if="${navCampaignCount != null}" th:text="${navCampaignCount}">0</span>
        </a>
        <a class="nav" th:classappend="${active == 'advertiser'} ? 'on'" href="/admin-hoya/ad/advertisers">
            <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.9"/></svg>
            광고주
        </a>
        <a class="nav" th:classappend="${active == 'slot'} ? 'on'" href="/admin-hoya/ad/slots">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="10" height="6" rx="1"/></svg>
            슬롯
            <span class="count" th:if="${navSlotCount != null}" th:text="${navSlotCount}">0</span>
        </a>
        <a class="nav" th:classappend="${active == 'unit'} ? 'on'" href="/admin-hoya/ad/units">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            광고 설정
            <span class="count" th:if="${navUnitCount != null}" th:text="${navUnitCount}">0</span>
        </a>
    </nav>

    <nav class="navgroup">
        <div class="cap">커뮤니티 운영</div>
        <a class="nav" th:classappend="${active == 'community-reports'} ? 'on'" href="/admin-hoya/community/reports">
            <svg viewBox="0 0 24 24"><path d="M10.29 3.86l-8.18 14.18A2 2 0 0 0 4 21h16a2 2 0 0 0 1.89-2.96L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            신고함
            <span class="count" th:if="${navReportCount != null}" th:text="${navReportCount}">0</span>
        </a>
        <a class="nav" th:classappend="${active == 'community-posts'} ? 'on'" href="/admin-hoya/community/posts">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
            글·댓글
        </a>
    </nav>

    <nav class="navgroup">
        <div class="cap">사이트 운영</div>
        <a class="nav" th:classappend="${active == 'notice'} ? 'on'" href="/admin-hoya/notices">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8"/><path d="M8 12h5"/></svg>
            공지
            <span class="count" th:if="${navNoticeCount != null}" th:text="${navNoticeCount}">0</span>
        </a>
    </nav>

    <div class="foot">
        <span class="avatar">호</span>
        <span class="who">관리자<span>프랙티켓 광고</span></span>
        <form action="/admin-hoya/logout" method="get">
            <button type="submit">로그아웃</button>
        </form>
    </div>
</aside>

<div th:fragment="toast" class="toast" id="toast"></div>

<script th:fragment="toastScript">
    function showToast(message) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function copyReportLink(button, path) {
        const url = window.location.origin + path;
        navigator.clipboard.writeText(url)
            .then(() => showToast('리포트 링크를 복사했습니다'))
            .catch(() => showToast('복사에 실패했습니다. 링크를 직접 선택해 복사해주세요.'));
    }
</script>

<!--
  삭제·밴처럼 되돌리기 어려운 동작의 확인 절차. alert()/confirm() 은 쓰지 않는다 —
  화면 밖으로 나가는 네이티브 다이얼로그 대신, 버튼을 두 번 눌러야 실제로 제출되게 한다.
  첫 클릭은 제출을 막고 라벨을 data-confirm-text 로 바꾼 뒤 3초 안에 다시 누르면 통과시킨다.
-->
<script th:fragment="confirmScript">
    function armConfirm(button) {
        if (button.dataset.armed === '1') {
            return true;
        }
        if (!button.dataset.original) {
            button.dataset.original = button.textContent;
        }
        button.dataset.armed = '1';
        button.textContent = button.dataset.confirmText || '정말?';
        button.classList.add('armed');
        clearTimeout(button._resetTimer);
        button._resetTimer = setTimeout(() => {
            button.dataset.armed = '0';
            button.textContent = button.dataset.original;
            button.classList.remove('armed');
        }, 3000);
        return false;
    }
</script>

</body>
</html>
