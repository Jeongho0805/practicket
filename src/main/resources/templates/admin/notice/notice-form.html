<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head(${notice != null ? '공지 수정' : '공지 등록'})}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('notice')}"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1 th:text="${notice != null ? '공지 수정' : '새 공지 등록'}">새 공지 등록</h1>
                <p>등록하면 홈 상단 5건과 /notice 목록에 바로 반영됩니다.</p>
            </div>
            <a class="btn ghost" href="/admin-hoya/notices">목록으로</a>
        </div>

        <div th:if="${error}" class="alert" th:text="${error}"></div>

        <div class="card formcard">
            <div class="pad">
                <form th:action="${notice != null ? '/admin-hoya/notices/' + notice.id : '/admin-hoya/notices'}"
                      method="post">

                    <div class="f">
                        <label for="type">종류</label>
                        <select id="type" name="type" required>
                            <option th:each="t : ${types}"
                                    th:value="${t.name()}"
                                    th:text="${t.label}"
                                    th:selected="${notice != null and notice.type == t}">
                            </option>
                        </select>
                        <p class="hint">공지 = 보라색 배지 · 수정 = 회색 배지</p>
                    </div>

                    <div class="f">
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" required maxlength="255"
                               placeholder="예: 서버 점검 안내 — 7/2(수) 새벽 2시~4시"
                               th:value="${notice != null ? notice.title : ''}"/>
                        <p class="hint">홈에서는 한 줄로 잘려 표시됩니다. 앞부분에 핵심을 두세요.</p>
                    </div>

                    <div class="f">
                        <label for="content">본문</label>
                        <textarea id="content" name="content" required rows="12"
                                  placeholder="줄바꿈은 그대로 반영됩니다."
                                  th:text="${notice != null ? notice.content : ''}"></textarea>
                        <p class="hint">HTML 태그는 적용되지 않고 글자 그대로 나옵니다. 줄바꿈만 살아납니다.</p>
                    </div>

                    <div class="f checkrow">
                        <input type="checkbox" id="pinned" name="pinned" value="true"
                               th:checked="${notice != null and notice.pinned}"/>
                        <label for="pinned">상단 고정 (최신순보다 먼저 표시)</label>
                    </div>

                    <div class="f checkrow">
                        <input type="checkbox" id="published" name="published" value="true"
                               th:checked="${notice == null or notice.published}"/>
                        <label for="published">공개 (끄면 어드민에만 보입니다)</label>
                    </div>

                    <div class="formactions">
                        <button type="submit" class="btn" th:text="${notice != null ? '수정 저장' : '등록'}">등록</button>
                        <a class="btn ghost" href="/admin-hoya/notices">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{admin/fragments/admin-shell :: toast}"></div>
<script th:replace="~{admin/fragments/admin-shell :: toastScript}"></script>
</body>
</html>
