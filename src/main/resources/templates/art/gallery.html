<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta name="title" content="팬아트 갤러리 - 프랙티켓">
    <meta name="description" content="프랙티켓에서 포도알로 내 최애를 응원해보세요.">
    <title>포도아트 - 프랙티켓</title>
    <link rel="stylesheet" href="/css/art/gallery.css">
</head>
<body>
    <div layout:fragment="content" id="main-section">
        <div id="art-section">

            <div id="art-hero">
                <div id="hero-top">
                    <div id="hero-title-box">
                        <h1 id="art-heading">포도아트</h1>
                        <p id="art-subtitle">포도알을 채워 최애를 응원해보세요</p>
                    </div>
                    <a href="/art/create" id="create-art-btn">만들기</a>
                </div>

                <form id="art-search">
                    <svg id="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.4" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                    </svg>
                    <input type="text" id="search-input" maxlength="50" placeholder="제목 또는 닉네임 검색">
                    <button type="submit" id="search-btn">검색</button>
                </form>
            </div>

            <div id="art-filterbar">
                <div class="filter-row">
                    <span class="filter-label">필터</span>
                    <button type="button" class="art-chip" data-filter="ALL">전체</button>
                    <button type="button" class="art-chip" data-filter="WEEK">이번 주</button>
                    <button type="button" class="art-chip" data-filter="MINE">내 작품</button>
                    <button type="button" class="art-chip" data-filter="LIKED">좋아요한 작품</button>
                </div>
                <div class="filter-row">
                    <span class="filter-label">정렬</span>
                    <button type="button" class="art-chip sm" data-sort="LATEST">최신<b class="sort-dir"></b></button>
                    <button type="button" class="art-chip sm" data-sort="LIKE">좋아요<b class="sort-dir"></b></button>
                    <button type="button" class="art-chip sm" data-sort="VIEW">조회<b class="sort-dir"></b></button>
                    <button type="button" class="art-chip sm" data-sort="COMMENT">댓글<b class="sort-dir"></b></button>
                </div>
            </div>

            <div id="gallery-grid"></div>
            <p id="gallery-empty" hidden>해당하는 작품이 없어요</p>

        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script type="module" src="/js/art/gallery.js"></script>
    </th:block>
</body>
</html>
