<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>작품 상세 - 프랙티켓</title>
    <link rel="stylesheet" href="/css/art/detail.css">
</head>
<body>
    <div layout:fragment="content" id="main-section">
        <div id="art-detail-section">

            <div id="art-head">
                <div id="head-left">
                    <h1 id="art-title">작품 제목</h1>
                    <div id="art-meta">
                        <span id="art-author">작성자</span>
                        <i class="meta-dot">·</i>
                        <span id="created-at"></span>
                        <i class="meta-dot">·</i>
                        <span>조회 <span id="view-count">0</span></span>
                    </div>
                </div>
                <div id="art-actions">
                    <button type="button" class="line-btn" id="download-btn">이미지 저장</button>
                    <button type="button" class="line-btn owner-only" id="edit-btn" hidden>수정</button>
                    <button type="button" class="line-btn owner-only" id="delete-btn" hidden>삭제</button>
                    <a class="line-btn" href="/art" id="list-btn">목록</a>
                </div>
            </div>

            <div id="art-display">
                <canvas id="art-canvas"></canvas>
            </div>

            <div id="art-bar">
                <button type="button" class="pill" id="art-likes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="좋아요">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    좋아요 <span id="like-count">0</span>
                </button>
                <span class="pill static">댓글 <span id="comment-count">0</span></span>
            </div>

            <div id="comments-section">
                <div id="comment-form">
                    <input type="text" id="comment-input" maxlength="500" placeholder="댓글을 입력하세요">
                    <button type="button" id="comment-submit-btn">작성</button>
                </div>
                <div id="comments-list"></div>
            </div>

        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            const ART_ID = "[[${artId}]]";
        </script>
        <script type="module" src="/js/art/detail.js"></script>
    </th:block>
</body>
</html>
