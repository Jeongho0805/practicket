<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta name="title" content="티켓팅 성공을 위한 정보 - 프랙티켓">
    <meta name="description" content="티켓팅 성공을 위한 필수 정보와 꿀팁들을 프랙티켓에서 확인해보세요">
    <meta name="robots" content="index, follow">
    <title>블로그 - 프랙티켓</title>
    <link rel="canonical" href="https://practicket.com/blog">
    <link rel="stylesheet" href="/css/blog.css">
</head>
<body>
    <div layout:fragment="content" id="main-section">
        <div id="blog-hero">
            <h1 id="blog-title">티켓팅 정보</h1>
            <p id="blog-subtitle">예매 성공률을 높이는 팁과 분석을 모았어요</p>
        </div>
        <div id="blog-list">
            <a class="blog-detail" th:each="post : ${posts}" th:href="@{'/blog/' + ${post.id}}">
                <div class="thumb-box">
                    <img class="thumb-nail" th:src="${post.thumbnailImagePath}" th:alt="${post.title}">
                </div>
                <div class="blog-detail-content">
                    <h2 class="blog-detail-title" th:text="${post.title}"></h2>
                    <p class="blog-detail-description" th:text="${post.subtitle}"></p>
                    <div class="blog-detail-meta">
                        <span>
                            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                            <span th:text="${post.dateLabel}"></span>
                        </span>
                        <span th:if="${post.hasViews}">
                            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <span th:text="${post.viewLabel}"></span>
                        </span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
