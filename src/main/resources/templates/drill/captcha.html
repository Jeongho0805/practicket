<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta name="description" content="티켓 예매 보안문자 입력을 반복해서 연습하세요. 영문 6자 3문제를 1분 안에 풀고, 자주 틀리는 글자를 누적 기록으로 확인할 수 있습니다.">
    <meta name="robots" content="index, follow">
    <title>보안문자 연습 - 프랙티켓</title>
    <link rel="canonical" href="https://practicket.com/drill/captcha">
    <link rel="stylesheet" href="/css/practice/result-modal.css">
    <link rel="stylesheet" href="/css/drill/drill.css">
</head>
<body>
    <main layout:fragment="content" class="drill-page is-captcha" id="drill-page">
        <div class="practice-sticky">
            <section class="practice-controls" aria-label="연습 설정">
                <div class="practice-toolbar">
                    <div class="practice-intro"><h1 class="a-title">보안문자</h1><span>영문 6자 · 3문제</span></div>
                    <div class="practice-cta"><a class="sub" href="/drill">다른 연습</a><button type="button" class="go" id="drill-start">시작하기</button></div>
                </div>
            </section>
        </div>

        <section class="rec" id="rec"></section>

        <details class="v-analysis" id="typo-stats">
            <summary>
                <span class="analysis-copy"><b>누적 오타 분석</b><small>전체 기록 기준</small></span>
                <svg class="analysis-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </summary>
            <div class="v-analysis-body"></div>
        </details>

        <div class="drill-play" id="drill-play"></div>
    </main>

    <th:block layout:fragment="scripts">
        <script type="module" src="/js/drill/captcha.js"></script>
    </th:block>
</body>
</html>
