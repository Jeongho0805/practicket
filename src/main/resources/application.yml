spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
  # 스키마는 Flyway가 관리한다. ddl-auto 는 계속 none 으로 둔다.
  # 이미 테이블이 있는 DB 에는 baseline-version 까지를 "적용된 것"으로 기록하고 그 다음부터 실행한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
server:
  # X-Forwarded-* 를 프록시가 붙인 것으로 해석한다(톰캣 RemoteIpValve).
  # 신뢰 프록시를 오른쪽부터 걷어낸 실제 클라이언트 IP 가 getRemoteAddr() 로 들어온다.
  # framework 옵션은 프록시 신뢰 검사 없이 XFF 첫 항목을 쓰므로 쓰면 안 된다.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: "auth"
        http-only: true
# 네트워크 계정 값. 광고단위(ad_unit)와 달리 사이트에 하나뿐이고 바뀌지 않는다.
# 프로파일별 파일(application-*.yml)은 git 에 안 올라가므로 여기 둔다.
ad:
  adsense:
    client: ca-pub-5146591484722882
  coupang:
    tracking-code: AF2647827
    template: carousel
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
