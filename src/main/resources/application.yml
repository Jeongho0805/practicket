spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
  # 스키마는 Flyway가 관리한다. ddl-auto 는 계속 none 으로 둔다.
  # 이미 테이블이 있는 DB 에는 baseline-version 까지를 "적용된 것"으로 기록하고 그 다음부터 실행한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
server:
  servlet:
    session:
      cookie:
        name: "auth"
        http-only: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
